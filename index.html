<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Translator Pro</title>

  <link rel="manifest" href="manifest.json">
  <!-- 📌 সঠিক গুগল ফন্ট লিঙ্ক যা কপি করলে নষ্ট হবে না -->
  <link rel="stylesheet" href="https://googleapis.com">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #4facfe, #00f2fe);
      --box-bg: #ffffff;
      --text-color: #333333;
      --heading-color: #ffffff;
      --input-border: #cccccc;
      --button-bg: #00c853;
    }

    body.dark {
      --bg-gradient: linear-gradient(135deg, #121212, #1c1c1c);
      --box-bg: #1e1e1e;
      --text-color: #f5f5f5;
      --heading-color: #00f2fe;
      --input-border: #444444;
      --button-bg: #00b24a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      transition: all 0.3s ease;
    }

    .header-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 10px 5px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--heading-color);
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      font-size: 18px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    
    body.dark .theme-toggle {
      background: rgba(255, 255, 255, 0.05);
      color: #ffca28;
    }

    .box {
      background: var(--box-bg);
      width: 100%;
      max-width: 420px;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transition: all 0.3s ease;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border: 1px solid var(--input-border);
      border-radius: 12px;
      font-size: 15px;
      background: transparent;
      color: var(--text-color);
      outline: none;
    }

    button.action-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--button-bg);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .row button.action-btn {
      margin-bottom: 0;
    }

    .btn-secondary {
      background: #4facfe !important;
    }
    .btn-danger {
      background: #ff5252 !important;
    }

    #output {
      margin-top: 15px;
      font-size: 18px;
      font-weight: 600;
      color: var(--text-color);
      min-height: 40px;
      padding: 10px;
      border-top: 1px dashed var(--input-border);
      word-wrap: break-word;
    }

    #historyContainer {
      margin-top: 15px;
      text-align: left;
      font-size: 13px;
      max-height: 120px;
      overflow-y: auto;
      background: rgba(0,0,0,0.03);
      padding: 10px;
      border-radius: 10px;
      display: none;
    }
    body.dark #historyContainer {
      background: rgba(255,255,255,0.03);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="app-title">🌍 Global Translator Pro</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="themeBtn">🌙</button>
  </div>

  <div class="box">
    <input type="text" id="text" class="input-field" placeholder="Enter text to translate...">

    <select id="lang" class="select-field">
      <option value="en">English</option>
      <option value="bn" selected>Bengali</option>
      <option value="ar">Arabic</option>
      <option value="hi">Hindi</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ja">Japanese</option>
      <option value="zh">Chinese</option>
      <option value="ko">Korean</option>
      <option value="ru">Russian</option>
      <option value="pt">Portuguese</option>
      <option value="it">Italian</option>
      <option value="tr">Turkish</option>
      <option value="th">Thai</option>
      <option value="ur">Urdu</option>
      <option value="id">Indonesian</option>
      <option value="vi">Vietnamese</option>
      <option value="fa">Persian</option>
      <option value="ms">Malay</option>
    </select>

    <button class="action-btn" onclick="translateText()">Translate</button>
    
    <div class="row">
      <button class="action-btn btn-secondary" onclick="swapLang()">↔️ Swap</button>
      <button class="action-btn btn-secondary" onclick="startVoice()">🎤 Voice</button>
    </div>

    <div class="row">
      <button class="action-btn" onclick="copyText()">📋 Copy</button>
      <button class="action-btn" onclick="speakText()">🔊 Speak</button>
    </div>

    <div class="row">
      <button class="action-btn btn-secondary" onclick="showHistory()">📜 History</button>
      <button class="action-btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
    </div>

    <p id="output"></p>
    <div id="historyContainer"></div>
  </div>

<script>
let timer;

function toggleDarkMode(){
  document.body.classList.toggle("dark");
  let btn = document.getElementById("themeBtn");
  if(document.body.classList.contains("dark")) {
    btn.innerText = "☀️";
  } else {
    btn.innerText = "🌙";
  }
}

async function translateText(){
  let text = document.getElementById("text").value;
  let lang = document.getElementById("lang").value;

  if(text.trim()===""){
    document.getElementById("output").innerText="";
    return;
  }

  // 📌 লিঙ্ক ভাঙার লজিকটি নিখুঁতভাবে ফিক্স করা হয়েছে যেন কপি করলে কোনো সমস্যা না হয়
  let protocol = "https://";
  let host = "translate.googleapis.com";
  let path = "/translate_a/single?client=gtx&sl=auto&tl=";
  let url = protocol + host + path + lang + "&dt=t&q=" + encodeURIComponent(text);

  try {
    let res = await fetch(url);
    let data = await res.json();
    let result = data[0][0][0];

    document.getElementById("output").innerText = result;
    saveHistory(text, result);
  } catch(error) {
    console.error("Error:", error);
  }
}

function swapLang(){
  let lang = document.getElementById("lang");
  lang.selectedIndex = (lang.selectedIndex + 1) % lang.options.length;
  translateText();
}

function startVoice(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    alert("ভয়েস ইনপুট ব্রাউজারে সাপোর্ট করছে না।");
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SpeechRecognition();
  rec.lang = "en-US"; 
  rec.start();

  rec.onresult = function(e){
    document.getElementById("text").value = e.results[0][0].transcript;
    translateText();
  }
}

function copyText(){
  let outputText = document.getElementById("output").innerText;
  if(outputText) {
    navigator.clipboard.writeText(outputText);
    alert("অনুবাদ কপি করা হয়েছে!");
  }
}

function speakText(){
  let targetLang = document.getElementById("lang").value;
  let text = document.getElementById("output").innerText;
  if(!text) return;

  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = targetLang;
  speechSynthesis.speak(msg);
}

function saveHistory(inp, out){
  let h = JSON.parse(localStorage.getItem("h")||"[]");
  if(h.length > 0 && h[0].inp === inp) return; 
  
  h.unshift({inp, out});
  if(h.length > 5) h.pop();
  localStorage.setItem("h", JSON.stringify(h));
}

function showHistory() {
  let container = document.getElementById("historyContainer");
  let h = JSON.parse(localStorage.getItem("h")||"[]");
  
  if(h.length === 0) {
    container.innerHTML = "<i>কোনো হিস্ট্রি পাওয়া যায়নি।</i>";
  } else {
    container.innerHTML = "<strong>সাম্প্রতিক অনুবাদসমূহ:</strong><br>";
    h.forEach(item => {
      container.innerHTML += `• ${item.inp} ➔ ${item.out}<br>`;
    });
  }
  container.style.display = container.style.display === "block" ? "none" : "block";
}

function clearAll(){
  document.getElementById("text").value="";
  document.getElementById("output").innerText="";
  document.getElementById("historyContainer").style.display = "none";
}

document.getElementById("text").addEventListener("input", function(){
  clearTimeout(timer);
  timer = setTimeout(()=>translateText(), 800);
});
</script>

</body>
</html>
